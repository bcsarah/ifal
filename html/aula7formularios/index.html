<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Formulário Fanclube Tv-Girl</title>
</head>

<body>
    <header>
        <h1>Fanclube Tv-Girl (OFICIAL)</h1>
        <p>Preencha o formulário para entrar no nosso fanclube!</p>
    </header>

    <hr>

    <!-- Formulário -->
    <form action="#" method="post">

        <!-- Nome -->
        <label for="nome">* Nome completo:</label>
        <input 
            type="text" 
            id="nome" 
            placeholder="Ex: Luiz Felipe" 
            required
        >
        <br><br>
    
        <!-- Data de Nascimento-->
        <label for="nascimento">* Data de Nascimento:</label>
        <input 
            type="date" 
            id="nascimento" 
            required
        >
        <br><br>

        <!-- Email -->
        <label for="email">* E-mail:</label>
        <input 
            type="email" 
            id="email" 
            placeholder="luizf123@gmail.com" 
            required
        >
        <br><br>

        <!-- Telefone -->
        <label for="telefone">* Telefone:</label>
        <input 
            type="tel" 
            id="telefone" 
            placeholder="(82) 9 4002-8922"
            required
        >
        <br><br>

        <!-- Mensagem -->
        <label for="mensagem">Mensagem Motivacional:</label>
        <textarea 
            id="mensagem" 
            placeholder="Ex: Suas músicas me insipam!!"
            rows="3" 
            cols="32" 
        ></textarea>
        <br><br><br>

        <!-- Botão p/ enviar-->
        <button type="submit">Enviar</button>
    </form>
</body>

</html>
